<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year-End Markdown Sale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* WellnessRX Year-End Markdown Sale banner
     Paste this whole file into Wix: Add Elements > Embed Code > Embed HTML > "Code".
     Suggested element size: full width x 220px desktop / 300px mobile. */
  :root {
    --sage-900: #1f3a2e;
    --sage-700: #2f5944;
    --sage-500: #5f8f74;
    --cream: #fbf7ef;
    --gold: #e2b555;
    --gold-deep: #c8912c;
    --blush: #f3d9c8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; font-family: "Inter", system-ui, sans-serif; }

  .wrx-banner {
    position: relative;
    overflow: hidden;
    min-height: 220px;
    padding: 28px clamp(16px, 4vw, 56px);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 24px;
    color: var(--cream);
    background:
      radial-gradient(circle at 12% 120%, rgba(226,181,85,.35), transparent 45%),
      radial-gradient(circle at 95% -20%, rgba(243,217,200,.25), transparent 40%),
      linear-gradient(115deg, var(--sage-900) 0%, var(--sage-700) 55%, var(--sage-500) 100%);
    border-radius: 18px;
  }

  /* floating leaves + sparkles */
  .wrx-float { position: absolute; pointer-events: none; opacity: .18; animation: drift 9s ease-in-out infinite; }
  .wrx-float.l1 { top: -18px; left: 38%; width: 90px; animation-delay: 0s; }
  .wrx-float.l2 { bottom: -26px; left: 58%; width: 120px; transform: rotate(140deg); animation-delay: -3s; }
  .wrx-float.l3 { top: 20%; right: 2%; width: 60px; animation-delay: -6s; }
  @keyframes drift {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(10px) rotate(8deg); }
  }
  .wrx-spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px var(--gold); animation: twinkle 2.8s ease-in-out infinite; }
  .wrx-spark.s1 { top: 22%; left: 8%; }
  .wrx-spark.s2 { top: 70%; left: 46%; animation-delay: -1s; }
  .wrx-spark.s3 { top: 18%; left: 72%; animation-delay: -2s; }
  @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.2); } }

  .wrx-copy { position: relative; z-index: 1; min-width: 0; }
  .wrx-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--sage-900); background: var(--gold);
    padding: 6px 12px; border-radius: 999px;
  }
  .wrx-eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sage-900); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .wrx-title {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: clamp(28px, 4.2vw, 50px);
    line-height: 1.02;
    margin: 12px 0 8px;
  }
  .wrx-title em { font-style: normal; color: var(--gold); }

  .wrx-range {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px;
    font-size: clamp(15px, 1.7vw, 19px);
    color: var(--blush);
  }
  .wrx-pct {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: clamp(32px, 4.6vw, 56px);
    color: var(--cream);
    line-height: 1;
  }
  .wrx-pct.big {
    color: var(--gold);
    text-shadow: 0 2px 18px rgba(226,181,85,.45);
    animation: glow 2.4s ease-in-out infinite;
  }
  @keyframes glow { 50% { text-shadow: 0 2px 30px rgba(226,181,85,.85); } }
  .wrx-arrow { font-size: clamp(22px, 3vw, 34px); color: var(--gold); }

  .wrx-sub { margin-top: 10px; font-size: 14px; color: rgba(251,247,239,.85); max-width: 560px; }

  .wrx-side { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; }

  .wrx-countdown { display: flex; gap: 8px; }
  .wrx-unit {
    min-width: 58px; text-align: center;
    background: rgba(251,247,239,.12);
    border: 1px solid rgba(251,247,239,.25);
    border-radius: 12px; padding: 8px 6px;
    backdrop-filter: blur(4px);
  }
  .wrx-unit b { display: block; font-family: "Fraunces", Georgia, serif; font-size: 24px; }
  .wrx-unit span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }

  .wrx-cta {
    display: inline-block; text-decoration: none;
    font-weight: 700; font-size: 15px; letter-spacing: .02em;
    color: var(--sage-900); background: var(--cream);
    padding: 14px 28px; border-radius: 999px;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
    transition: transform .2s ease, background .2s ease;
  }
  .wrx-cta:hover { transform: translateY(-2px); background: var(--gold); }
  .wrx-fine { font-size: 11px; opacity: .7; text-align: center; }

  @media (max-width: 720px) {
    .wrx-banner { grid-template-columns: minmax(0, 1fr); text-align: center; padding: 24px 16px; }
    .wrx-eyebrow { font-size: 10px; letter-spacing: .12em; }
    .wrx-unit { min-width: 52px; }
    .wrx-range { justify-content: center; }
    .wrx-sub { margin-left: auto; margin-right: auto; }
    .wrx-float.l3 { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <section class="wrx-banner" aria-label="Year-end markdown sale">
    <!-- decorative leaves -->
    <svg class="wrx-float l1" viewBox="0 0 64 64" aria-hidden="true"><path fill="#fbf7ef" d="M8 56C8 26 28 8 58 6c-2 30-20 50-50 50zm6-6c12-14 24-24 38-36-16 8-28 20-38 36z"/></svg>
    <svg class="wrx-float l2" viewBox="0 0 64 64" aria-hidden="true"><path fill="#e2b555" d="M8 56C8 26 28 8 58 6c-2 30-20 50-50 50zm6-6c12-14 24-24 38-36-16 8-28 20-38 36z"/></svg>
    <svg class="wrx-float l3" viewBox="0 0 64 64" aria-hidden="true"><path fill="#f3d9c8" d="M8 56C8 26 28 8 58 6c-2 30-20 50-50 50zm6-6c12-14 24-24 38-36-16 8-28 20-38 36z"/></svg>
    <i class="wrx-spark s1"></i><i class="wrx-spark s2"></i><i class="wrx-spark s3"></i>

    <div class="wrx-copy">
      <span class="wrx-eyebrow"><span class="dot"></span>End of the Year Markdown Sale</span>
      <h2 class="wrx-title">Wrap up 2026 <em>well.</em></h2>
      <div class="wrx-range">
        <span>Save</span>
        <span class="wrx-pct">15%</span>
        <span class="wrx-arrow">&rarr;</span>
        <span class="wrx-pct big">75% off</span>
      </div>
      <p class="wrx-sub">Pharmacist-curated supplements, teas &amp; natural wellness essentials, marked down while supplies last.</p>
    </div>

    <div class="wrx-side">
      <div class="wrx-countdown" id="wrx-countdown" aria-label="Time left in sale">
        <div class="wrx-unit"><b id="wrx-d">--</b><span>Days</span></div>
        <div class="wrx-unit"><b id="wrx-h">--</b><span>Hrs</span></div>
        <div class="wrx-unit"><b id="wrx-m">--</b><span>Min</span></div>
      </div>
      <a class="wrx-cta" href="https://www.wellnessrxpharmacy.ca/shop" target="_top">Shop the Sale &rarr;</a>
      <p class="wrx-fine">Discounts vary by product · Online, while quantities last · Ends Dec 31</p>
    </div>
  </section>

<script>
  (function () {
    // Sale ends Dec 31, 2026 at 11:59 PM Toronto time (EST, UTC-5)
    var end = new Date("2026-12-31T23:59:59-05:00").getTime();
    var box = document.getElementById("wrx-countdown");
    function pad(n) { return n < 10 ? "0" + n : "" + n; }
    function tick() {
      var diff = end - Date.now();
      if (diff <= 0) { box.style.display = "none"; return; }
      var d = Math.floor(diff / 86400000);
      var h = Math.floor(diff / 3600000) % 24;
      var m = Math.floor(diff / 60000) % 60;
      document.getElementById("wrx-d").textContent = d;
      document.getElementById("wrx-h").textContent = pad(h);
      document.getElementById("wrx-m").textContent = pad(m);
    }
    tick();
    setInterval(tick, 30000);
  })();
</script>
</body>
</html>
