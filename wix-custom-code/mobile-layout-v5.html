<script>
/* Sale bar: its links are tiny (~16px tall) on phones. Make the whole bar tappable:
   a tap anywhere on it (except the close button) follows the link of the message showing. */
(function(){
  function wire(){
    var bar = document.getElementById('wrx-sale-banner');
    if (!bar || bar.__wrxTap) return;
    bar.__wrxTap = 1;
    bar.addEventListener('click', function(e){
      if (!window.matchMedia('(max-width: 768px)').matches) return;
      if (e.target.closest('.wrx-close') || e.target.closest('a')) return;
      var link = bar.querySelector('.wrx-slide.visible a.wrx-link');
      if (link) link.click();
    });
    bar.style.cursor = 'pointer';
  }
  wire(); document.addEventListener('DOMContentLoaded', wire); window.addEventListener('load', wire);
  [500, 1500, 3000].forEach(function(t){ setTimeout(wire, t); });
})();

/* Scroll states for phones: wrx-scrolled = past the top; wrx-hdr-hide = scrolling down. */
(function(){
  var root = document.documentElement, lastY = window.pageYOffset || 0, ticking = false;
  function phone(){ return window.matchMedia('(max-width: 768px)').matches; }
  function menuOpen(){ return document.body && document.body.classList.contains('siteScrollingBlockedIOSFix'); }
  function update(){
    ticking = false;
    var y = window.pageYOffset || 0, dy = y - lastY;
    if (!phone() || menuOpen()) { lastY = y; return; }
    if (y < 120) { root.classList.remove('wrx-scrolled', 'wrx-hdr-hide'); lastY = y; return; }
    root.classList.add('wrx-scrolled');
    if (Math.abs(dy) < 8) return;
    if (dy > 0) root.classList.add('wrx-hdr-hide'); else root.classList.remove('wrx-hdr-hide');
    lastY = y;
  }
  window.addEventListener('scroll', function(){ if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
  window.addEventListener('resize', update);
})();
</script>
